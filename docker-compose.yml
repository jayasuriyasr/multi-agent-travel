# Axentra — full local stack.
#
#   make docker-up     build and start everything
#   make db-up         just Postgres and Redis, for `go run ./cmd/axentra`
#
# The `version` key is obsolete in Compose v2 and is deliberately omitted.

services:

  postgres:
    image: postgres:15-alpine
    container_name: axentra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: axentra_user
      POSTGRES_PASSWORD: axentra_pass
      POSTGRES_DB: axentra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axentra_user -d axentra_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: axentra_redis
    restart: unless-stopped
    # AOF on for durability of the dirty stream and poll locks; RDB snapshots
    # off, since a periodic dump buys nothing on top of AOF here.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save ""
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  axentra:
    build: .
    container_name: axentra_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Every variable below is read by internal/config and takes effect.
      PG_DSN: "postgres://axentra_user:axentra_pass@postgres:5432/axentra_db?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      AUTO_MIGRATE: "true"
      FIBER_PORT: "8080"
      ASYNQ_CONCURRENCY: "20"
      WATCHER_INTERVAL_SEC: "30"
      CLASSIFY_INTERVAL_SEC: "300"
      SEAT_PROVIDER: "mock"
      MAX_ROUNDS: "4"
      MIN_TRANSFER_SECONDS: "0"
      STRICT_SEAT_MODE: "false"
      REDIS_MGET_CHUNK: "512"
      STREAM_BATCH_SIZE: "500"
      MIN_RESYNC_INTERVAL_SEC: "30"
      SEAT_BREAKER_THRESHOLD: "5"
      SEAT_BREAKER_COOLDOWN_SEC: "15"
      MAX_WALK_SECONDS: "1800"
      MAX_FOOTPATHS_PER_STATION: "64"
      RATE_LIMIT_PER_MIN: "600"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
